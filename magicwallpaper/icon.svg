<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Magic Fluids app icon">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08071A" />
      <stop offset="45%" stop-color="#1A0B36" />
      <stop offset="100%" stop-color="#05192D" />
    </linearGradient>

    <!-- Glass Overlay -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>

    <!-- Stream Gradients -->
    <linearGradient id="streamCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#00BBF9" />
      <stop offset="100%" stop-color="#4361EE" />
    </linearGradient>

    <linearGradient id="streamMagenta" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F72585" />
      <stop offset="45%" stop-color="#B5179E" />
      <stop offset="100%" stop-color="#7209B7" />
    </linearGradient>

    <linearGradient id="streamGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9E00" />
      <stop offset="60%" stop-color="#FF5400" />
      <stop offset="100%" stop-color="#FF0054" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="fluidGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="256" height="256" rx="58" fill="url(#bgGrad)" />

  <!-- Ambient Glow Behind Swirls -->
  <circle cx="160" cy="90" r="60" fill="#F72585" opacity="0.35" filter="url(#softGlow)" />
  <circle cx="90" cy="170" r="65" fill="#00BBF9" opacity="0.35" filter="url(#softGlow)" />
  <circle cx="170" cy="180" r="50" fill="#FF9E00" opacity="0.25" filter="url(#softGlow)" />

  <!-- Fluid Swirl Trails -->
  <g filter="url(#fluidGlow)">
    <!-- Cyan Swirl Ribbon -->
    <path d="M42 165 C 60 210, 110 220, 145 195 C 185 165, 175 110, 135 100 C 95 90, 85 130, 115 145 C 135 155, 155 140, 150 125" 
          fill="none" stroke="url(#streamCyan)" stroke-width="15" stroke-linecap="round" opacity="0.95" />

    <!-- Magenta Swirl Ribbon -->
    <path d="M214 91 C 196 46, 146 36, 111 61 C 71 91, 81 146, 121 156 C 161 166, 171 126, 141 111 C 121 101, 101 116, 106 131" 
          fill="none" stroke="url(#streamMagenta)" stroke-width="13" stroke-linecap="round" opacity="0.9" />

    <!-- Gold Accent Ribbon -->
    <path d="M70 70 C 110 40, 190 70, 180 140 C 170 190, 120 200, 95 180 C 75 165, 80 135, 105 130 C 125 125, 135 140, 130 150" 
          fill="none" stroke="url(#streamGold)" stroke-width="9" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Glowing Fluid Droplets / Sparkles -->
  <circle cx="68" cy="115" r="4.5" fill="#00F5D4" opacity="0.9" />
  <circle cx="195" cy="145" r="3.5" fill="#F72585" opacity="0.9" />
  <circle cx="158" cy="65" r="5" fill="#FFD166" opacity="0.9" />
  <circle cx="102" cy="198" r="4" fill="#00BBF9" opacity="0.8" />
  <circle cx="188" cy="175" r="3" fill="#FFF" opacity="0.9" />
  <circle cx="85" cy="85" r="2.5" fill="#FFF" opacity="0.8" />

  <!-- Glass Highlight Border & Sheen -->
  <rect width="256" height="256" rx="58" fill="url(#glassGrad)" />
  <rect width="254" height="254" x="1" y="1" rx="57" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" />
</svg>
