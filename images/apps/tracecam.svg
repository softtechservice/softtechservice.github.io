<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="TraceCam app icon">
  <defs>
    <linearGradient id="tc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3730A3"/>
      <stop offset="45%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="tc-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tc-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#tc-bg)"/>
  <rect width="256" height="256" rx="58" fill="url(#tc-shine)"/>

  <!-- Content Group -->
  <g transform="translate(40, 40)">
    <!-- Viewfinder Reticle Frame Corners -->
    <path d="M12 40 L12 20 A 8 8 0 0 1 20 12 L40 12" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <path d="M136 12 L156 12 A 8 8 0 0 1 164 20 L164 40" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <path d="M164 136 L164 156 A 8 8 0 0 1 156 164 L136 164" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <path d="M40 164 L20 164 A 8 8 0 0 1 12 156 L12 136" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

    <!-- Reference Paper / Overlay Canvas -->
    <rect x="28" y="28" width="120" height="120" rx="16" fill="url(#tc-glow)" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="6 4" stroke-opacity="0.75"/>

    <!-- Subtle Alignment Grid (Rule of Thirds) -->
    <line x1="68" y1="30" x2="68" y2="146" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.35"/>
    <line x1="108" y1="30" x2="108" y2="146" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.35"/>
    <line x1="30" y1="68" x2="146" y2="68" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.35"/>
    <line x1="30" y1="108" x2="146" y2="108" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.35"/>

    <!-- Camera Lens Aperture Ring -->
    <circle cx="88" cy="88" r="32" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="88" cy="88" r="14" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="3.5"/>

    <!-- Traced Contour / Curve -->
    <path d="M46 118 C 62 76, 102 70, 126 102" fill="none" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>

    <!-- Precision Drawing Stylus / Pen -->
    <g transform="translate(98, 42) rotate(42)">
      <!-- Pen body -->
      <rect x="0" y="0" width="18" height="66" rx="6" fill="#FFFFFF"/>
      <rect x="3" y="16" width="12" height="34" rx="3" fill="#6366F1"/>
      <!-- Pen nib -->
      <polygon points="0,66 18,66 9,84" fill="#FDE047"/>
      <circle cx="9" cy="82" r="2.5" fill="#1E1B4B"/>
    </g>
  </g>
</svg>
