<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Hindi Calendar Panchang App Icon">
  <defs>
    <!-- Background Gradient: Deep celestial cosmic night -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14192E" />
      <stop offset="45%" stop-color="#0E1325" />
      <stop offset="100%" stop-color="#080B17" />
    </linearGradient>

    <!-- Warm Divine Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="35%" stop-color="#FFB300" />
      <stop offset="70%" stop-color="#F57C00" />
      <stop offset="100%" stop-color="#D84315" />
    </linearGradient>

    <!-- Subtle Golden Shimmer -->
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="30%" stop-color="#FFD54F" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Sun Glow Filter -->
    <filter id="celestialGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="sunAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB300" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#E65100" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FF9800" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="116" fill="url(#skyGrad)" />
  <rect width="512" height="512" rx="116" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.65" />
  <rect width="512" height="512" rx="116" fill="url(#shimmerGrad)" />

  <!-- Outer Aura Glow -->
  <circle cx="256" cy="240" r="160" fill="url(#sunAura)" />

  <!-- Geometric Mandala Ring (Astrological Rashi Ring) -->
  <circle cx="256" cy="240" r="148" fill="none" stroke="#FFB300" stroke-width="2.5" stroke-dasharray="6, 8" opacity="0.4" />
  <circle cx="256" cy="240" r="128" fill="none" stroke="#FFD54F" stroke-width="2" opacity="0.5" />

  <!-- Calendar Page Top Accent Bar -->
  <path d="M156 120 C156 112 162 106 170 106 L342 106 C350 106 356 112 356 120 L356 132 L156 132 Z" fill="url(#goldGrad)" opacity="0.9" />
  <circle cx="200" cy="119" r="4.5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="256" cy="119" r="4.5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="312" cy="119" r="4.5" fill="#FFFFFF" opacity="0.9" />

  <!-- Sun Rays (12 Rays representing 12 Rashis / Solar months) -->
  <g transform="translate(256, 240)" filter="url(#celestialGlow)">
    <!-- 8 Primary Rays -->
    <path d="M0 -115 L7 -82 L-7 -82 Z" fill="url(#goldGrad)" />
    <path d="M0 115 L7 82 L-7 82 Z" fill="url(#goldGrad)" />
    <path d="M-115 0 L-82 7 L-82 -7 Z" fill="url(#goldGrad)" />
    <path d="M115 0 L82 7 L82 -7 Z" fill="url(#goldGrad)" />

    <path d="M-81 -81 L-58 -70 L-70 -58 Z" fill="url(#goldGrad)" />
    <path d="M81 -81 L58 -70 L70 -58 Z" fill="url(#goldGrad)" />
    <path d="M-81 81 L-58 70 L-70 58 Z" fill="url(#goldGrad)" />
    <path d="M81 81 L58 70 L70 58 Z" fill="url(#goldGrad)" />

    <!-- 8 Secondary Delicate Rays -->
    <path d="M0 -96 L3 -78 L-3 -78 Z" fill="#FFE082" opacity="0.8" transform="rotate(22.5)" />
    <path d="M0 -96 L3 -78 L-3 -78 Z" fill="#FFE082" opacity="0.8" transform="rotate(67.5)" />
    <path d="M0 -96 L3 -78 L-3 -78 Z" fill="#FFE082" opacity="0.8" transform="rotate(112.5)" />
    <path d="M0 -96 L3 -78 L-3 -78 Z" fill="#FFE082" opacity="0.8" transform="rotate(157.5)" />
    <path d="M0 -96 L3 -78 L-3 -78 Z" fill="#FFE082" opacity="0.8" transform="rotate(202.5)" />
    <path d="M0 -96 L3 -78 L-3 -78 Z" fill="#FFE082" opacity="0.8" transform="rotate(247.5)" />
    <path d="M0 -96 L3 -78 L-3 -78 Z" fill="#FFE082" opacity="0.8" transform="rotate(292.5)" />
    <path d="M0 -96 L3 -78 L-3 -78 Z" fill="#FFE082" opacity="0.8" transform="rotate(337.5)" />
  </g>

  <!-- Central Surya & Chandra Synergy (Sun disc with waxing Crescent Moon) -->
  <circle cx="256" cy="240" r="54" fill="url(#goldGrad)" />

  <!-- Lunar Crescent Carve-out -->
  <path d="M256 196 A 44 44 0 1 1 212 240 A 38 38 0 1 0 256 196 Z" fill="#FFFDF8" opacity="0.95" />

  <!-- Divine Bindu / Center Star -->
  <circle cx="268" cy="232" r="9" fill="#FFFFFF" />
  <polygon points="268,217 271,228 282,232 271,236 268,247 265,236 254,232 265,228" fill="#FFFFFF" opacity="0.9" />

  <!-- Bottom Elegant Banner / Script "पञ्चाङ्ग" symbol or celestial dots -->
  <g fill="#FFD54F" opacity="0.8">
    <circle cx="196" cy="406" r="4" />
    <circle cx="216" cy="406" r="4" />
    <circle cx="236" cy="406" r="4" />
    <circle cx="256" cy="406" r="5" fill="#FFE082" />
    <circle cx="276" cy="406" r="4" />
    <circle cx="296" cy="406" r="4" />
    <circle cx="316" cy="406" r="4" />
  </g>

  <!-- Subtle Constellation Stars -->
  <circle cx="120" cy="190" r="3" fill="#FFF59D" opacity="0.6" />
  <circle cx="390" cy="180" r="2.5" fill="#FFF59D" opacity="0.7" />
  <circle cx="130" cy="320" r="2.5" fill="#FFF59D" opacity="0.5" />
  <circle cx="370" cy="330" r="3" fill="#FFF59D" opacity="0.6" />
  <circle cx="340" cy="90" r="2" fill="#FFFFFF" opacity="0.5" />
  <circle cx="170" cy="80" r="2" fill="#FFFFFF" opacity="0.5" />
</svg>
